name: Auto Unzip Codebase

on:
  push:
    paths:
      - '*.zip' # Triggers only when a .zip file is uploaded to the root directory

jobs:
  unzip-file:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository content
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Unzip all zip files in the root directory
      - name: Extract Zip Files
        run: |
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Extracting $file..."
              unzip -o "$file" -d ./
              rm "$file" # Deletes the zip file so your repo stays clean
            fi
          done

      # Step 3: Commit the extracted folder structure back to GitHub
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add -A
          # Check if there are any changes to commit to avoid workflow errors
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated: Unzipped codebase folders"
            git push
          else
            echo "No files found to extract."
          fi
